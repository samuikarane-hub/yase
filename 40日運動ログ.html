<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>40日運動ログ</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#2f312f;--muted:#7d807b;--line:#dedbd3;--accent:#5d765f;--accent2:#dfe9df;--done:#e6f0e5}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button{font:inherit;color:inherit}.app{max-width:760px;margin:auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px}
h1{font-size:24px;margin:0 0 5px}.sub{font-size:13px;color:var(--muted)}
.viewbar{display:flex;gap:8px;margin-bottom:14px}.viewbar button,.back{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 13px;cursor:pointer}.viewbar button.active{background:var(--accent);color:white;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
.month{font-weight:700;font-size:17px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{font-size:11px;text-align:center;color:var(--muted);padding:3px}.day{min-height:66px;border:1px solid var(--line);background:white;border-radius:11px;padding:6px;cursor:pointer;position:relative;text-align:left}.day.out{visibility:hidden}.day.today{outline:2px solid #9cad9a}.day .num{font-size:12px}.day .mark{position:absolute;right:6px;bottom:5px;font-size:17px}.day .bar{position:absolute;left:6px;right:6px;bottom:6px;height:3px;background:#e7e5df;border-radius:9px;overflow:hidden}.day .fill{height:100%;background:var(--accent)}
.week-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.week-title{font-weight:700}.weeknav{display:flex;gap:6px}.weeknav button{border:1px solid var(--line);background:white;border-radius:10px;padding:6px 10px;cursor:pointer}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.wday{border:1px solid var(--line);border-radius:12px;background:white;padding:8px 5px;cursor:pointer;min-width:0}.wday.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.wday .date{font-size:11px;color:var(--muted)}.wday .n{font-weight:700;margin-top:3px}.wday .mini{font-size:12px;margin-top:6px}
.progress{height:9px;background:#ebe9e3;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent);transition:.2s}.progressText{font-size:13px;color:var(--muted);margin-top:6px}
.task{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #eee}.task:last-child{border-bottom:0}.task input{width:21px;height:21px;accent-color:var(--accent)}.task.done .name{text-decoration:line-through;color:var(--muted)}.task .kind{font-size:11px;color:var(--muted);margin-top:2px}
h2{font-size:17px;margin:0 0 12px}.note{font-size:13px;line-height:1.65;color:var(--muted)}.empty{padding:18px;text-align:center;color:var(--muted)}
@media(max-width:520px){.app{padding:15px 10px 32px}.day{min-height:58px}.day .bar{left:4px;right:4px}.wday{padding:7px 3px}.wday .mini{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>40日 運動ログ</h1><div class="sub">9/20〜10/29　「続けた日」を残す</div></div><div class="sub" id="overall"></div></header>
<div class="viewbar"><button id="monthBtn" class="active">40日カレンダー</button><button id="weekBtn">週間ビュー</button></div>
<section id="monthView"></section>
<section id="weekView" hidden></section>
</div>
<script>
const START = new Date(2026,8,20);
const DAYS=40;
const endDate=new Date(START); endDate.setDate(endDate.getDate()+DAYS-1);
const key="exercise40_2026_09_20";
let state=JSON.parse(localStorage.getItem(key)||"{}");
let weekStart=new Date(START);
let selected=new Date(START);

function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function inRange(d){return d>=START&&d<=endDate}
function save(){localStorage.setItem(key,JSON.stringify(state))}
function dayNum(d){return Math.floor((d-START)/86400000)+1}
function fmt(d){return `${d.getMonth()+1}/${d.getDate()}`}
function jpDow(d){return ["日","月","火","水","木","金","土"][d.getDay()]}
function same(a,b){return iso(a)===iso(b)}
function phaseFor(n){return n<=10?1:n<=20?2:n<=30?3:4}

function strengthText(p){
  return p===1?"スクワット8〜10回×2／ヒップリフト10回×2／壁腕立て8〜10回×2／足踏み30秒×2":
  p===2?"スクワット10回×2／ヒップリフト15回×2／壁腕立て10回×2／かかと上げ15回×2／足踏み45秒×2":
  p===3?"スクワット12回×2／ヒップリフト15回×2／リバースランジ左右6回×2／かかと上げ20回×2／足踏み1分×2":
  "スクワット15回／ヒップリフト15回／リバースランジ左右8回／かかと上げ20回／壁腕立て10回を2セット";
}
function runText(p){
  return p===1?"1km・約10分（前後に5分歩く）":
  p===2?"1〜1.5km・10〜15分":
  p===3?"1.5〜2km・15〜20分":
  "2km前後・15〜20分";
}

function weeklyPool(ws){
  const mid = new Date(ws); mid.setDate(mid.getDate()+3);
  const n=Math.min(40,Math.max(1,dayNum(mid)));
  const phase=phaseFor(n);
  return [
    {id:"strength1",base:"strength",name:"筋トレ①",detail:strengthText(phase),kind:"筋力"},
    {id:"strength2",base:"strength",name:"筋トレ②",detail:strengthText(phase),kind:"筋力"},
    {id:"strength3",base:"strength",name:"筋トレ③",detail:strengthText(phase),kind:"筋力"},
    {id:"run1",base:"run",name:"ランニング①",detail:runText(phase),kind:"有酸素"},
    {id:"run2",base:"run",name:"ランニング②",detail:runText(phase),kind:"有酸素"},
    {id:"walk1",base:"walk",name:"散歩①",detail:"20〜40分（好きな範囲で）",kind:"活動"},
    {id:"walk2",base:"walk",name:"散歩②",detail:"20〜40分（好きな範囲で）",kind:"活動"}
  ];
}

function weekKey(ws){return iso(ws)}
function getAssignments(ws){
  const k=weekKey(ws);
  state.weeks=state.weeks||{};
  state.weeks[k]=state.weeks[k]||{};
  return state.weeks[k];
}
function assignedTasks(d){
  const ws=new Date(d); ws.setDate(d.getDate()-d.getDay());
  const a=getAssignments(ws);
  const pool=weeklyPool(ws);
  return pool.filter(t=>a[t.id]===iso(d));
}
function setAssignment(ws,taskId,dateStr){
  const a=getAssignments(ws);
  if(dateStr==="") delete a[taskId]; else a[taskId]=dateStr;
  save(); renderWeek();
}
function completedAssigned(d,id){
  return !!(state[iso(d)]&&state[iso(d)].done&&state[iso(d)].done[id])
}
function toggleAssigned(d,id){
  const k=iso(d);
  state[k]=state[k]||{};
  state[k].done=state[k].done||{};
  state[k].done[id]=!state[k].done[id];
  save(); render();
}
function dayProgress(d){
  const t=assignedTasks(d);
  return [t.filter(x=>completedAssigned(d,x.id)).length,t.length];
}

function renderMonth(){
  const el=document.getElementById("monthView"); el.innerHTML="";
  const card=document.createElement("div"); card.className="card";
  card.innerHTML='<div class="month">40日間のカレンダー</div>';
  const grid=document.createElement("div");grid.className="grid";
  ["日","月","火","水","木","金","土"].forEach(x=>{
    let e=document.createElement("div");e.className="dow";e.textContent=x;grid.appendChild(e)
  });
  let cur=new Date(START); cur.setDate(cur.getDate()-cur.getDay());
  for(let i=0;i<42;i++){
    let d=new Date(cur);d.setDate(cur.getDate()+i);
    let b=document.createElement("button");b.className="day";
    if(!inRange(d)) b.classList.add("out");
    else{
      const [done,total]=dayProgress(d);
      if(same(d,new Date(2026,8,21))) b.classList.add("today");
      b.innerHTML=`<div class="num">${d.getDate()}日</div><div class="bar"><div class="fill" style="width:${total?done/total*100:0}%"></div></div>${done===total&&total?'<div class="mark">✓</div>':''}`;
      b.onclick=()=>{
        selected=new Date(d);
        weekStart=new Date(d);
        weekStart.setDate(d.getDate()-d.getDay());
        showWeek()
      };
    }
    grid.appendChild(b);
  }
  card.appendChild(grid);el.appendChild(card);

  const p=document.createElement("div");p.className="card";
  let done=0;
  for(let i=0;i<DAYS;i++){
    let d=new Date(START);
    d.setDate(d.getDate()+i);
    let q=dayProgress(d);
    done+=(q[1]>0&&q[0]===q[1])?1:0;
  }
  p.innerHTML=`<h2>40日間の歩み</h2>
  <div class="progress"><div style="width:${done/DAYS*100}%"></div></div>
  <div class="progressText">${done} / ${DAYS} 日達成</div>
  <div class="note">✓ が付いた日は、その日のメニューをすべて達成した日です。データはこの端末のブラウザに保存されます。</div>`;
  el.appendChild(p);
}

function showWeek(){
  document.getElementById("monthView").hidden=true;
  document.getElementById("weekView").hidden=false;
  document.getElementById("monthBtn").classList.remove("active");
  document.getElementById("weekBtn").classList.add("active");
  renderWeek()
}
function showMonth(){
  document.getElementById("monthView").hidden=false;
  document.getElementById("weekView").hidden=true;
  document.getElementById("monthBtn").classList.add("active");
  document.getElementById("weekBtn").classList.remove("active");
  renderMonth()
}

function renderWeek(){
  const el=document.getElementById("weekView");el.innerHTML="";
  const nav=document.createElement("div");nav.className="card";
  nav.innerHTML=`<div class="week-head"><div class="week-title">${fmt(weekStart)}〜${fmt(new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+6))}</div><div class="weeknav"><button id="prev">‹</button><button id="next">›</button></div></div>`;
  nav.querySelector("#prev").onclick=()=>{
    const d=new Date(weekStart);d.setDate(d.getDate()-7);weekStart=d;renderWeek()
  };
  nav.querySelector("#next").onclick=()=>{
    const d=new Date(weekStart);d.setDate(d.getDate()+7);weekStart=d;renderWeek()
  };

  const ws=document.createElement("div");ws.className="weekdays";
  for(let i=0;i<7;i++){
    let d=new Date(weekStart);d.setDate(d.getDate()+i);
    let b=document.createElement("button");
    b.className="wday"+(same(d,selected)?" selected":"");
    if(!inRange(d)){b.disabled=true;b.style.opacity=.35}
    const [done,total]=dayProgress(d);
    b.innerHTML=`<div class="date">${jpDow(d)}</div><div class="n">${d.getMonth()+1}/${d.getDate()}</div><div class="mini">${done}/${total}</div>`;
    b.onclick=()=>{selected=new Date(d);renderWeek()};
    ws.appendChild(b)
  }
  nav.appendChild(ws);el.appendChild(nav);

  if(!inRange(selected)){
    el.innerHTML+='<div class="card empty">40日間の範囲外です。</div>';
    return
  }

  const selectedTasks=assignedTasks(selected);
  const [done,total]=dayProgress(selected);
  const card=document.createElement("div");card.className="card";
  card.innerHTML=`<h2>${fmt(selected)}（${jpDow(selected)}）</h2><div class="progress"><div style="width:${total?done/total*100:0}%"></div></div><div class="progressText">${done}/${total} 項目達成</div>`;

  if(!selectedTasks.length){
    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent="今日はまだメニューが割り振られていません。下の「今週やることを割り振る」から選べます。";
    card.appendChild(empty);
  } else {
    const list=document.createElement("div");
    selectedTasks.forEach(t=>{
      const row=document.createElement("label");
      row.className="task"+(completedAssigned(selected,t.id)?" done":"");
      row.innerHTML=`<input type="checkbox" ${completedAssigned(selected,t.id)?"checked":""}><div><div class="name">${t.name}</div><div class="kind">${t.kind}　${t.detail}</div></div>`;
      row.querySelector("input").onchange=()=>toggleAssigned(selected,t.id);
      list.appendChild(row);
    });
    card.appendChild(list);
  }
  el.appendChild(card);

  const weekly=document.createElement("div");weekly.className="card";
  const pool=weeklyPool(weekStart);
  let all=0,wdone=0;
  for(let i=0;i<7;i++){
    let d=new Date(weekStart);d.setDate(d.getDate()+i);
    if(inRange(d)){let q=dayProgress(d);wdone+=q[0];all+=q[1]}
  }
  weekly.innerHTML=`<h2>今週の進み具合</h2><div class="progress"><div style="width:${all?wdone/all*100:0}%"></div></div><div class="progressText">${wdone}/${all} 項目達成　・　${pool.filter(t=>getAssignments(weekStart)[t.id]).length}/${pool.length} 個を予定に配置</div><div class="note">「あと何が残っているか」は、下の割り振り欄と各日の達成数で確認できます。</div>`;
  el.appendChild(weekly);

  // 一番下に「今週やることを割り振る」を配置
  const poolCard=document.createElement("div");poolCard.className="card";
  poolCard.innerHTML=`<h2>今週やることを割り振る</h2><div class="note">下のメニューごとに「何曜日にやるか」を選んでください。曜日は自由です。割り振った内容が、その日のカレンダーに表示されます。</div>`;
  pool.forEach(t=>{
    const row=document.createElement("div");row.className="task";
    const a=getAssignments(weekStart)[t.id]||"";
    const opts=[`<option value="">まだ決めない</option>`];
    for(let i=0;i<7;i++){
      const d=new Date(weekStart);d.setDate(d.getDate()+i);
      if(inRange(d)) opts.push(`<option value="${iso(d)}" ${a===iso(d)?"selected":""}>${jpDow(d)} ${fmt(d)}</option>`);
    }
    row.innerHTML=`<div style="flex:1;min-width:0"><div class="name">${t.name}</div><div class="kind">${t.kind}　${t.detail}</div></div><select aria-label="${t.name}を行う日">${opts.join("")}</select>`;
    row.querySelector("select").onchange=e=>setAssignment(weekStart,t.id,e.target.value);
    poolCard.appendChild(row);
  });
  el.appendChild(poolCard);
}

document.getElementById("monthBtn").onclick=showMonth;
document.getElementById("weekBtn").onclick=showWeek;
document.getElementById("monthView").hidden=false;
document.getElementById("weekView").hidden=true;

function updateOverall(){
  let d=0,t=0;
  for(let i=0;i<DAYS;i++){
    let x=new Date(START);x.setDate(x.getDate()+i);
    let q=dayProgress(x);d+=q[0];t+=q[1]
  }
  document.getElementById("overall").textContent=`達成 ${d}/${t}`;
}
function render(){
  updateOverall();
  renderMonth();
  if(!document.getElementById("weekView").hidden)renderWeek()
}
render();
</script>
</body>
</html>
